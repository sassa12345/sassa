<!DOCTYPE html>

    <title>チャットサイトの使い方</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            padding: 20px;
            background-color: #f4f4f4;
        }
        h3 {
            color: #333;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            margin: 10px 0;
        }
        button {
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {

        }

<body>

<h2>チャットサイトの使い方</h2>
<p>現在、例のサイトでバグが発生しています。治すことはできましたが、今まで使っていたタブレットに前のデータが残っており、使える状況ではありません（治す方法はあるけどめんどい）。<br>
なので、一時的（ずっとかも）に既存のチャットサイトを使うことにしようと思います。</p>

<p>
    <button onclick="window.open('https://bubudoufu.com/online-app/chat/', '_blank')">チャットサイトにアクセス</button>
</p>

<ol>
    <li>名前のところに名前、部屋名に「戸坂」と入力して部屋に入るを押す（右のボタンでボイチャも可）</li>
    <li>設定から通知音をオンにしたりができる（電源を切ってても可）<br>
    ちなみに全員が抜けると履歴が消えます。</li>
</ol>
